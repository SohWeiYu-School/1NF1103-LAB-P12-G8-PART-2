# Claude reviews each PR once when it is opened (not on every push, to save usage).
# For another review after new pushes, comment "@claude review" on the PR
# (handled by claude-mention.yml).
name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    # Skip draft PRs; they get reviewed when marked "ready for review".
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first: its rules are graded,
            so check the PR against them before anything else:
            - Code is in classes that match the UML; private attributes use __name.
            - Managers (app/interface, app/ai, app/logic, app/data) never import each
              other or app/application. Only WebApp may call App.
            - print()/input() only in the IO Manager (ConsoleUI).
            - app/logic is pure: no file access, no network calls, no printing.
            - The benchmark AI call sends only the ALLOWED_FIELDS, never declared figures.
            - Section 9: every input is validated, and errors are never hidden
              (no empty result as an error fallback, no fake PASSED, real error logged,
              honest non-technical message for the user).
            - Tests are plain pytest functions, one test file per class, no real AI calls.

            Then look for bugs, missing validation and security problems.
            Be specific and quote file:line. Skip praise and style nitpicks.

            Note: the PR branch is already checked out in the current working directory.
            Use `gh pr comment` for the overall summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for issues on specific lines.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
